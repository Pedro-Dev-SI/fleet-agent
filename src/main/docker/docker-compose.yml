services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: fleet-agent-postgres
    environment:
      POSTGRES_DB: fleet_agent
      POSTGRES_USER: fleet_agent
      POSTGRES_PASSWORD: fleet_agent
    ports:
      - "5433:5432"
    volumes:
      - fleet-agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_agent -d fleet_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fleet-agent-postgres-data:
    name: fleet-agent-postgres-data
